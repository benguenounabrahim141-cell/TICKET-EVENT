<! DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,
    initial-scale="1.0">
<title>digital event ticket</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ticket">
        <div class="ticket-inner">
            <div class="ticket-header">
                <h1>🎟️ web tech event</h1>
                <h2>🎉 you're invited</h2>
                <p class="welcome">join us for a great learning<br>experience</p>
                </div>
                <div class="info">
                    <div class="row">
                        <span class="label"><span class="icon">🧑</span>guest</span>
                        <span class="value">rayan</span>
                    </div>
                    <div class="row">
                        <span class="label"><span class="icon">🗓️</span>date</span>
                        <span class="value">30 AUG 2026</span>
                    </div>
                    <div class="row">
                        <span class="label"><span class="icon">⏰</span>time</span>
                        <span class="value">10:00 AM</span>
                        </div>
                        <div class="row">
                            <span class="label"><span class="icon">🪑</span>seat</span>
                            <span class="value">A-15</span>
                        </div>

                        <div class="divider"></div>

                        <div class="ticket-footer">
                        <p class="id-label">TICKET ID</p>
                        <p class="ticket-id">VW2026</p>
                        <div class="barcode"></div>
                        <p class="thanks">😊 thank you</p> 
                        </div>
                        </div>
                        </div>   
  
</body>
</html>
